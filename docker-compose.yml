services:
  # Midnight Network Off-Chain Halo2 Zero-Knowledge Proof Server
  proof-server:
    image: midnightntwrk/proof-server:latest
    container_name: voidcloud-midnight-proof-server
    ports:
      - "6300:6300"
    environment:
      - RUST_LOG=info
      - MIDNIGHT_NETWORK=preprod
      - PROOF_SERVER_PORT=6300
    restart: unless-stopped

